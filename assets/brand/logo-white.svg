<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">Baltic Wasserveredlung – Logo V11</title>
<desc id="desc">Harmonisch gestaffelte Wasserwellen mit gemeinsamem rechten Endpunkt und abgestufter Länge.</desc>

<defs>
  <linearGradient id="gDeep" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#0B3A55"/>
    <stop offset="58%" stop-color="#0E526D"/>
    <stop offset="100%" stop-color="#0B3A55"/>
  </linearGradient>
  <linearGradient id="gAqua" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#159DB8"/>
    <stop offset="55%" stop-color="#2FB6D6"/>
    <stop offset="100%" stop-color="#159DB8"/>
  </linearGradient>
  <linearGradient id="gLight" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#5FC7D5"/>
    <stop offset="55%" stop-color="#7ED6E3"/>
    <stop offset="100%" stop-color="#5FC7D5"/>
  </linearGradient>
</defs>

<!-- V11:
     gemeinsamer rechter Endpunkt x=758.
     Untere Welle Start x=345.
     Mittlere Welle Start x=272.
