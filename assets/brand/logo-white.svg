  <text x="515" y="558" fill="#FFFFFF" font-size="41.5" font-weight="400"
        textLength="610" lengthAdjust="spacing">WASSERVEREDLUNG</text>
  <text x="515" y="610" fill="#FFFFFF" font-size="22" font-weight="400"
